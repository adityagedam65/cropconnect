name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cropconnect-backend
    env:
      CROP_DATA_SECRET_KEY: test-data-secret-for-ci
      CROP_AUTH_TOKEN_SECRET: test-auth-secret-for-ci
      PUBLIC_RATE_LIMIT_DB_FAIL_OPEN: "true"
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DATABASE: cropconnect_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.8.4
      - name: Validate environment config
        working-directory: cropconnect-backend
        env:
          CROP_DATA_SECRET_KEY: ${{ secrets.CROP_DATA_SECRET_KEY || 'ci-test-placeholder-not-for-prod-1234567890ab' }}
          CROP_AUTH_TOKEN_SECRET: ${{ secrets.CROP_AUTH_TOKEN_SECRET || 'ci-test-placeholder-not-for-prod-1234567890ab' }}
          ESP32_API_KEY: ${{ secrets.ESP32_API_KEY || 'ci-test-key' }}
          FRONTEND_ORIGINS: "https://cropconnect01.vercel.app"
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DATABASE: cropconnect_test
        run: |
          python - <<'EOF'
          from config import validate_required_environment
          problems = validate_required_environment()
          if problems:
              print("Environment problems found:")
              for p in problems:
                  print(f"  - {p}")
              exit(1)
          print("Environment validation passed")
          EOF
      - name: Check no placeholder secrets in source
        run: |
          if grep -r "replace-with" . --include="*.py" --include="*.env*" \
             --exclude-dir=".git" | grep -v "PLACEHOLDER_PATTERNS\|PLACEHOLDER_SECRETS\|config.py\|security_crypto.py\|app.py"; then
            echo "ERROR: placeholder secret found in source"
            exit 1
          fi
          echo "No placeholder secrets found"
      - name: Lint backend
        run: ruff check .
      - name: Test backend
        run: python -m unittest discover -s tests
      - name: Run MySQL integration test
        run: |
          python migrate_db.py
          python -m pytest tests/test_mysql_integration.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cropconnect-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cropconnect-frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Test frontend
        run: npm run test
      - name: Check protected routes
        run: npm run check
      - name: Generate PWA icons
        working-directory: cropconnect-frontend
        run: |
          if [ ! -f public/icon-192.png ] || [ ! -f public/icon-512.png ]; then
            npm install
            npm run generate-icons
          else
            echo "PWA icons already present, skipping generation"
          fi
      - name: Build frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: cropconnect-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cropconnect-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Start frontend dev server
        run: |
          npm run start -- --host 0.0.0.0 &
          npx wait-on http://localhost:3000 --timeout 30000
        env:
          VITE_BACKEND_URL: http://localhost:8001
      - name: Run E2E smoke tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: "true"
